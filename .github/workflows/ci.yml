name: CI Test & Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Server Tests
        run: ./gradlew :app:test

  web-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Typecheck & Build
        working-directory: web
        run: |
          npm run check
          npm run build

      - name: Run Web Test Suite
        working-directory: web
        run: npx tsx test/run-all.ts

  # 版本号单一来源：真源是 app/build.gradle，其余几处都是抄本。
  # 放在 PR 阶段比，而不是只在打 Tag 时比 —— 等 Tag 才发现不一致，这一版已经发不出去了。
  version-consistency:
    name: Version Single Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version consistency
        run: node scripts/version-check.mjs

