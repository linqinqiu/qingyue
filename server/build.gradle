plugins {
    alias libs.plugins.kotlin.jvm
    alias libs.plugins.kotlin.serialization
    id 'application'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

test {
    // 测试工作进程的堆上限。不写就按物理内存的一档去要（本机 24GB → 要 6GB 提交空间），
    // 而这台机器同时跑着服务本体 + 门禁的 headless Chrome，提交内存常常只剩几百 MB，
    // 表现是 `insufficient memory for the Java Runtime Environment … mmap failed to map 400556032 bytes`
    // —— 红的是 JVM 起不来，不是任何一条用例失败（实测过一次，崩溃日志落在 server/ 下）。
    maxHeapSize = '768m'
    // 测试库都是 `Files.createTempFile` 建的（落在 java.io.tmpdir）。某些开发环境（沙箱/杀软）
    // 会对系统临时目录里的 sqlite 文件上锁，表现为大面积「另一个程序正在使用此文件」假失败；
    // 用 LEGADO_TEST_TMP 把测试临时文件挪到普通目录即可。CI 不设它，行为不变。
    systemProperty "java.io.tmpdir", System.getenv("LEGADO_TEST_TMP") ?: System.getProperty("java.io.tmpdir")
    // 失败时打全量异常（默认 SHORT 只有类名和行号，跨平台差异排查要消息与栈）。
    testLogging { exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}


group = 'io.legado'
version = '0.7.3'

base {
    // plain jar 与发行版统一叫 legado-server：Docker 构建层 `jar uf …/lib/legado-server-*.jar`
    // 按这个名找（issue #11）。嵌套 settings.gradle 删除后子项目名回落 'server'，
    // plain jar 会漂成 server-<版本>.jar；fatJar 下面已显式 set 同名，不受影响。
    archivesName = 'legado-server'
}

java {
    toolchain {
        // 本机只有 JDK 17（JDK 21 镜像拉不下来）。target 本来就是 17，降级只影响编译器版本。
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

application {
    // 名字钉死 legado-server：Docker 运行层拷 install/legado-server、启动 bin/legado-server。
    // 嵌套 settings.gradle 删除后（A 档）子项目名回落成 'server'，installDist 产物会漂成
    // install/server/bin/server，容器里既拷不到也起不来（issue #11 修复时发现）。
    applicationName = 'legado-server'
    mainClass = 'io.legado.server.ApplicationKt'
}

tasks.register('fatJar', Jar) {
    archiveBaseName.set('legado-server')
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // web/dist 自 2026-10-11（B 档）起不再进版本库：干净检出里它不存在，而 processResources
    // 只在它存在时才拷进 jar —— 不在这里拦一道，就会得到一个"只有后端、没有界面"的包，
    // 而且静默成功。注意只拦 fatJar：:server:test 不依赖界面产物，不能连带卡住。
    doFirst {
        if (!file("${rootProject.projectDir}/web/dist/index.html").exists()) {
            throw new GradleException("web/dist is missing — run `npm run build` first (or `npm --prefix web run build`).\nweb/dist 里没有界面产物 —— 先跑 `npm run build` 再打 fatJar。")
        }
    }
    manifest {
        attributes(
            'Main-Class': 'io.legado.server.ApplicationKt',
            'Implementation-Title': 'Legado Server',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with tasks.jar
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    if (file("${rootProject.projectDir}/web/dist").exists()) {
        from("${rootProject.projectDir}/web/dist") {
            into("static")
        }
    }
    // 更新日志随包发出：界面上那张「更新日志」页读的是 classpath 里这一份，
    // 不是去猜磁盘上的仓库路径（jar 单独拷到别的机器、Docker 镜像里都不该有路径依赖）。
    if (file("${rootProject.projectDir}/CHANGELOG.md").exists()) {
        from("${rootProject.projectDir}/CHANGELOG.md") {
            into("meta")
            rename { "changelog.md" }
        }
    }
}

dependencies {
    implementation "io.ktor:ktor-server-cio:3.4.3"
    implementation "io.ktor:ktor-server-core:3.4.3"
    implementation "io.ktor:ktor-server-content-negotiation:3.4.3"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.4.3"
    implementation "io.ktor:ktor-server-sessions:3.4.3"
    implementation "io.ktor:ktor-server-websockets:3.4.3"
    implementation "io.ktor:ktor-server-status-pages:3.4.3"
    implementation "org.xerial:sqlite-jdbc:3.49.1.0"
    implementation "org.jsoup:jsoup:1.18.3"
    // 规则引擎的 @xpath 方言支持（与 Legado 同款 xpath-on-jsoup），本地已有缓存版本 2.5.1
    implementation "cn.wanghaomiao:JsoupXpath:2.5.1"
    implementation "com.jayway.jsonpath:json-path:2.9.0"
    implementation "org.mozilla:rhino:1.8.0"
    implementation "org.slf4j:slf4j-simple:2.0.16"
    testImplementation "io.ktor:ktor-server-test-host:3.4.3"
    testImplementation "io.ktor:ktor-client-content-negotiation:3.4.3"
    testImplementation libs.junit
}

