<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读 · 精简版</title>
<!--
  单文件精简客户端：零构建、零依赖、零外部资源，只打同一套 /api。
  它刻意不含这些子系统：朗读 TTS、WebDAV、整书离线缓存、书源订阅定时同步、
  书源健康体检、内置登录浏览器、分阶段调试、替换规则编辑、本地 TXT/EPUB 导入。
  规则解析、翻页、净化、Cookie 仍在服务端 —— 浏览器直连书源站点会被 CORS 挡住，
  所以「一个 HTML 装下所有功能」只能装下客户端功能，引擎必须在服务端。
-->
<style>
  :root {
    --bg: #f6f6f3; --surface: #fff; --ink: #1b231d; --muted: #6a736c; --line: #dfe1dc;
    --accent: #3f7d54; --accent-soft: #e6f0e8; --danger: #b3362c;
    --reader-bg: #f6f1e7; --reader-ink: #2c2723;
  }
  .paper { --bg: #f6f1e7; --surface: #fbf7ef; --ink: #2f2a24; --muted: #7a7164; --line: #e3d9c6; --accent: #8a6a35; --accent-soft: #f0e6d2; }
  .dark { --bg: #14171a; --surface: #1b1f23; --ink: #dfe3e0; --muted: #8d968f; --line: #2c3238; --accent: #6fbf8b; --accent-soft: #223028; --reader-bg: #14171a; --reader-ink: #cfd6cf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button, .btn { min-height: 32px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 940px; margin: 0 auto; padding: 16px 14px 60px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  input[type=search], input[type=text], select, textarea { min-height: 36px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
  input[type=search] { flex: 1; min-width: 180px; }
  textarea { width: 100%; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; }
  .card { cursor: pointer; }
  .card .cov { aspect-ratio: 3/4; border-radius: 6px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; font-size: 26px; color: var(--accent); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card h4 { margin: 6px 0 1px; font-size: 13px; font-weight: 600; }
  .card p { margin: 0; font-size: 11px; color: var(--muted); }
  .list { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--accent-soft); }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 14px; }
  .item .t small { color: var(--muted); font-size: 11px; }
  .muted { color: var(--muted); font-size: 12px; }
  .hide { display: none; }
  .pill { padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 11px; }
  .sw { width: 36px; height: 21px; border-radius: 99px; background: var(--line); position: relative; flex: 0 0 auto; cursor: pointer; }
  .sw.on { background: var(--accent); }
  .sw i { position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on i { left: 18px; }
  #reader { position: fixed; inset: 0; z-index: 20; background: var(--reader-bg); color: var(--reader-ink); display: none; flex-direction: column; }
  #reader.on { display: flex; }
  #rbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--ink); flex-wrap: wrap; }
  #rbody { flex: 1; overflow-y: auto; padding: 22px 16px 60px; }
  #rtxt { max-width: var(--rw, 680px); margin: 0 auto; font-size: var(--rf, 18px); line-height: var(--rl, 1.9); }
  #rtxt p { margin: 0 0 1em; text-indent: 2em; }
  #rtxt h3 { margin: 0 0 1em; font-size: 1.25em; text-align: center; }
  #rtxt img { max-width: 100%; display: block; margin: 1em auto; }
  #toc { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); background: var(--surface); border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .2s; overflow-y: auto; z-index: 21; }
  #toc.on { transform: none; }
  #toc .item { cursor: pointer; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; max-width: 560px; width: calc(100vw - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  .dh { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .db { padding: 14px; }
  .df { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.dan { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <b>阅读 · 精简版</b>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<div id="reader">
  <div id="rbar"></div>
  <div id="rbody"><div id="rtxt"></div></div>
</div>
<div id="toc"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  read(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v) } catch { return fallback } },
  write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)) } catch {} },
};

/* ---------- 服务端调用：写操作一律带 CSRF 头 ---------- */
let csrf = '';
async function api(path, options) {
  const opts = options || {};
  const headers = Object.assign({}, opts.headers);
  if (opts.body != null) headers['Content-Type'] = 'application/json';
  if (opts.method && opts.method !== 'GET' && csrf) headers['X-CSRF-Token'] = csrf;
  const response = await fetch(path, { method: opts.method, headers, body: opts.body == null ? undefined : JSON.stringify(opts.body), credentials: 'same-origin' });
  if (!response.ok) {
    let message = 'HTTP ' + response.status;
    try { const data = await response.json(); if (data && data.message) message = data.message } catch {}
    throw new Error(message);
  }
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}
const get = path => api(path);
const post = (path, body) => api(path, { method: 'POST', body });
const put = (path, body) => api(path, { method: 'PUT', body });
const del = path => api(path, { method: 'DELETE' });

/* ---------- 全局状态 ---------- */
const state = {
  page: store.read('lite.page', 'shelf'),
  sources: [],
  groups: [],
  query: store.read('lite.query', ''),
  scope: store.read('lite.scope', 'all'),
  group: '',
  results: [],
  searching: false,
  book: store.read('lite.book', null),      // { details, chapters, bookUrl }
  chapter: store.read('lite.chapter', 0),
  reader: store.read('lite.reader', { font: 18, width: 680, line: 1.9, theme: 'light' }),
};
function applyTheme() {
  document.body.className = state.reader.theme === 'dark' ? 'dark' : state.reader.theme === 'paper' ? 'paper' : '';
}
const PAGES = [['shelf', '书架'], ['search', '搜索'], ['sources', '书源']];

function go(page) {
  state.page = page;
  store.write('lite.page', page);
  render();
}
function toast(message, kind) {
  const box = document.createElement('div');
  box.textContent = message;
  box.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;padding:9px 15px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;max-width:80vw';
  if (kind === 'err') box.style.background = 'var(--danger)';
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2600);
}

/* ---------- 渲染 ---------- */
function render() {
  $('#nav').innerHTML = PAGES.map(([key, label]) =>
    `<button type="button" class="${state.page === key ? 'on' : ''}" data-nav="${key}">${label}</button>`).join('') +
    `<button type="button" data-nav="reader" title="打开上次阅读的书">阅读</button>` +
    `<button type="button" data-act="theme" title="切换主题">主题</button>`;
  $('#nav').onclick = event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.nav === 'reader') return openReader();
    if (button.dataset.nav) return go(button.dataset.nav);
    if (button.dataset.act === 'theme') return cycleTheme();
  };
  if (state.page === 'shelf') return renderShelf();
  if (state.page === 'search') return renderSearch();
  if (state.page === 'sources') return renderSources();
  return renderShelf();
}
function cycleTheme() {
  const order = ['light', 'paper', 'dark'];
  state.reader.theme = order[(order.indexOf(state.reader.theme) + 1) % order.length];
  store.write('lite.reader', state.reader);
  applyTheme();
}

function coverOf(item) {
  if (item.coverKey) return `<img src="/api/covers/${encodeURIComponent(item.coverKey)}" alt="" loading="lazy">`;
  if (item.coverUrl) return `<img src="${esc(item.coverUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
  return esc((item.name || '?').replace(/[《【\[]/g, '').slice(0, 2));
}

async function renderShelf() {
  $('#main').innerHTML = '<p class="muted">读取书架…</p>';
  let items = [];
  try { items = await get('/api/bookshelf') } catch (error) { $('#main').innerHTML = `<p class="muted">书架读取失败：${esc(error.message)}</p>`; return }
  if (!items.length) {
    $('#main').innerHTML = '<p class="muted">书架是空的。去「搜索」找一本书。</p>';
    return
  }
  $('#main').innerHTML = `<p class="muted">${items.length} 本</p><div class="grid">` + items.map((item, index) => `
    <div class="card" data-open="${index}">
      <div class="cov">${coverOf(item)}</div>
      <h4>${esc(item.name)}</h4>
      <p>${item.chapterIndex == null ? '刚加入书架' : '第 ' + (item.chapterIndex + 1) + ' 章'}${item.totalChapters ? ' / ' + item.totalChapters : ''}</p>
    </div>`).join('') + '</div>';
  $('#main').onclick = event => {
    const card = event.target.closest('[data-open]');
    if (!card) return;
    openBook(items[Number(card.dataset.open)]);
  };
}

async function openBook(item) {
  toast('载入目录…');
  try {
    const chapters = await post('/api/books/chapters', { sourceId: item.sourceId, bookUrl: item.tocUrl || item.bookUrl });
    state.book = {
      details: {
        sourceId: item.sourceId, name: item.name, author: item.author,
        tocUrl: item.tocUrl || item.bookUrl, coverUrl: item.coverUrl, intro: item.intro,
      },
      bookUrl: item.bookUrl, chapters,
    };
    state.chapter = item.chapterIndex || 0;
    store.write('lite.book', state.book);
    store.write('lite.chapter', state.chapter);
    openReader();
  } catch (error) { toast('目录载入失败：' + error.message, 'err') }
}

function renderSearch() {
  $('#main').innerHTML = `
    <form id="sform" class="row">
      <input type="search" id="kw" placeholder="书名或作者" value="${esc(state.query)}">
      <select id="scope">
        <option value="all">全部启用书源</option>
        <option value="group">按分组</option>
        <option value="one">指定书源</option>
      </select>
      <select id="pick" class="hide"></select>
      <button type="submit" class="btn pri">搜索</button>
      <button type="button" id="stop" class="btn">停止</button>
    </form>
    <p class="muted" id="stat">${state.results.length ? state.results.length + ' 条结果' : '尚未搜索'}</p>
    <div id="res"></div>`;
  $('#scope').value = state.scope;
  fillPick();
  $('#scope').onchange = () => { state.scope = $('#scope').value; store.write('lite.scope', state.scope); fillPick() };
  $('#pick').onchange = () => { if (state.scope === 'group') state.group = $('#pick').value; else state.group = '' };
  $('#sform').onsubmit = event => { event.preventDefault(); runSearch() };
  $('#stop').onclick = () => { state.searching = false; $('#stat').textContent = '已停止' };
  $('#res').innerHTML = groupResults(state.results);
  $('#res').onclick = event => {
    const cell = event.target.closest('[data-hit]');
    if (cell) openDetail(state.results[Number(cell.dataset.hit)]);
  };
}
function fillPick() {
  const pick = $('#pick');
  if (!pick) return;
  if (state.scope === 'group') {
    const groups = [...new Set(state.sources.flatMap(s => (s.group || '').split(/[,\s]+/)).filter(Boolean))];
    pick.innerHTML = groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('') || '<option value="">（无分组）</option>';
  } else if (state.scope === 'one') {
    pick.innerHTML = state.sources.map((s, i) => `<option value="${i}">${esc(s.name)} · ${esc(s.group || '未分组')}</option>`).join('');
  }
  pick.classList.toggle('hide', state.scope === 'all');
}
function groupResults(list) {
  if (!list.length) return '<p class="muted">还没有结果。</p>';
  const groups = new Map();
  for (let i = 0; i < list.length; i++) {
    const hit = list[i];
    const key = (hit.name || '').trim().toLowerCase();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  return '<div class="list">' + [...groups.entries()].map(([name, indexes]) => {
    const first = list[indexes[0]];
    return `<div class="item" data-hit="${indexes[0]}"><div class="t"><b>${esc(first.name)}</b>
      <small>${esc(first.author || '未知作者')} · ${indexes.length} 个书源</small></div><span class="pill">详情</span></div>`;
  }).join('') + '</div>';
}
async function runSearch() {
  state.query = $('#kw').value.trim();
  if (!state.query) return;
  store.write('lite.query', state.query);
  let sourceIds = null;
  if (state.scope === 'group') {
    const tag = $('#pick').value;
    sourceIds = state.sources.filter(s => (s.group || '').split(/[,\s]+/).includes(tag)).map(s => s.id);
    if (!sourceIds.length) return toast('这个分组里没有书源', 'err');
  } else if (state.scope === 'one') {
    const chosen = state.sources[Number($('#pick').value)];
    if (!chosen) return toast('请先选一个书源', 'err');
    sourceIds = [chosen.id];
  }
  state.searching = true;
  state.results = [];
  $('#stat').textContent = '搜索中…';
  try {
    const found = await post('/api/search', { keyword: state.query, sourceIds });
    state.results = found;
    $('#stat').textContent = found.length + ' 条结果' + (sourceIds ? '（限定 ' + sourceIds.length + ' 源）' : '');
    $('#res').innerHTML = groupResults(found);
  } catch (error) { $('#stat').textContent = '搜索失败：' + error.message }
  state.searching = false;
}

async function openDetail(hit) {
  const box = $('#dlg');
  box.innerHTML = '<div class="dh">' + esc(hit.name) + '</div><div class="db muted">读取详情与目录…</div>';
  box.showModal();
  try {
    const details = await post('/api/books/details', { sourceId: hit.sourceId, bookUrl: hit.bookUrl });
    const chapters = await post('/api/books/chapters', { sourceId: hit.sourceId, bookUrl: details.tocUrl || hit.bookUrl });
    state.book = { details, bookUrl: hit.bookUrl, chapters };
    store.write('lite.book', state.book);
    box.innerHTML = `<div class="dh">${esc(details.name)}</div><div class="db">
      <p class="muted">${esc(details.author || '未知作者')} · ${chapters.length} 章 · ${esc(hit.sourceId)}</p>
      ${details.intro ? `<p>${esc(details.intro).slice(0, 400)}</p>` : ''}
      <p class="muted">点下面任意一章直接从那里开始读。</p>
      <div class="list" style="max-height:240px;overflow:auto">${chapters.slice(0, 60).map((c, i) =>
        `<div class="item" data-ch="${i}"><div class="t"><b>${esc(c.title)}</b></div></div>`).join('')}</div>
    </div><div class="df">
      <button type="button" class="btn" data-close>关闭</button>
      <button type="button" class="btn" data-shelf>加入书架</button>
      <button type="button" class="btn pri" data-read>开始阅读</button></div>`;
    box.onclick = async event => {
      if (event.target.closest('[data-close]')) return box.close();
      if (event.target.closest('[data-read]')) { state.chapter = 0; box.close(); return openReader() }
      const from = event.target.closest('[data-ch]');
      if (from) { state.chapter = Number(from.dataset.ch); box.close(); return openReader() }
      if (event.target.closest('[data-shelf]')) {
        try {
          await post('/api/bookshelf', {
            sourceId: details.sourceId, bookUrl: hit.bookUrl, name: details.name, author: details.author,
            tocUrl: details.tocUrl, coverUrl: details.coverUrl,
          });
          toast('已加入书架');
        } catch (error) { toast('加入失败：' + error.message, 'err') }
      }
    };
  } catch (error) {
    box.innerHTML = `<div class="dh">${esc(hit.name)}</div><div class="db"><p class="muted">详情读取失败：${esc(error.message)}</p></div>
      <div class="df"><button type="button" class="btn" data-close>关闭</button></div>`;
    box.onclick = event => { if (event.target.closest('[data-close]')) box.close() };
  }
}

/* ---------- 书源 ---------- */
async function renderSources() {
  $('#main').innerHTML = '<p class="muted">读取书源…</p>';
  try { state.sources = await get('/api/sources') } catch (error) { $('#main').innerHTML = `<p class="muted">${esc(error.message)}</p>`; return }
  const enabled = state.sources.filter(s => s.enabled);
  $('#main').innerHTML = `
    <div class="row">
      <input type="search" id="fq" placeholder="筛选书名或网址">
      <button type="button" class="btn" id="imp">导入书源 JSON</button>
    </div>
    <p class="muted">共 ${state.sources.length} 个，启用 ${enabled.length} 个。精简版只做启停与导入：体检、登录浏览器、调试、订阅都不在这里。</p>
    <div class="list" id="sl"></div>`;
  const draw = () => {
    const q = ($('#fq').value || '').toLowerCase();
    const list = state.sources.filter(s => !q || s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q)).slice(0, 300);
    $('#sl').innerHTML = list.map(s => `<div class="item" data-id="${esc(s.id)}">
      <span class="sw ${s.enabled ? 'on' : ''}" data-toggle="${esc(s.id)}" role="switch" aria-checked="${s.enabled}" tabindex="0"><i></i></span>
      <div class="t"><b>${esc(s.name)}</b><small>${esc(s.group || '未分组')} · ${esc(s.url)}</small></div>
      ${s.hasLogin ? '<span class="pill">登录</span>' : ''}${s.isJsSource ? '<span class="pill">JS</span>' : ''}
    </div>`).join('') + (list.length >= 300 ? '<p class="muted">只显示前 300 条，用筛选框缩小范围。</p>' : '');
  };
  draw();
  $('#fq').oninput = draw;
  $('#imp').onclick = importDialog;
  $('#sl').onclick = async event => {
    const sw = event.target.closest('[data-toggle]');
    if (!sw) return;
    const id = sw.dataset.toggle;
    const source = state.sources.find(s => s.id === id);
    try {
      await post('/api/sources/batch', { action: source.enabled ? 'disable' : 'enable', ids: [id] });
      source.enabled = !source.enabled;
      sw.classList.toggle('on', source.enabled);
      sw.setAttribute('aria-checked', String(source.enabled));
    } catch (error) { toast('切换失败：' + error.message, 'err') }
  };
}
function importDialog() {
  const box = $('#dlg');
  box.innerHTML = `<div class="dh">导入书源 JSON</div><div class="db">
    <p class="muted">粘贴 Legado 书源数组（或单个对象）。导入后默认全部启用状态由服务端按原字段决定。</p>
    <textarea id="src" rows="10" placeholder='[{"bookSourceUrl":"https://…","bookSourceName":"…"}]'></textarea>
  </div><div class="df"><button type="button" class="btn" data-close>取消</button>
    <button type="button" class="btn pri" data-do>导入</button></div>`;
  box.showModal();
  box.onclick = async event => {
    if (event.target.closest('[data-close]')) return box.close();
    if (!event.target.closest('[data-do]')) return;
    let parsed;
    try {
      const value = JSON.parse($('#src').value);
      parsed = Array.isArray(value) ? value : [value];
    } catch { return toast('不是合法 JSON', 'err') }
    try {
      const result = await post('/api/sources/import', { sources: parsed.map(item => JSON.stringify(item)) });
      toast(`导入完成：新增 ${result.imported}，更新 ${result.updated || 0}，跳过 ${result.skipped}`);
      box.close();
      renderSources();
    } catch (error) { toast('导入失败：' + error.message, 'err') }
  };
}

/* ---------- 阅读器 ---------- */
function openReader() {
  if (!state.book) return toast('还没有打开任何书', 'err');
  $('#reader').classList.add('on');
  state.page = 'reader';
  drawReaderBar();
  loadChapter(state.chapter);
}
function drawReaderBar() {
  const { details, chapters } = state.book;
  $('#rbar').innerHTML = `
    <button type="button" class="btn" data-x="toc">目录</button>
    <button type="button" class="btn" data-x="prev">上一章</button>
    <span class="muted">${esc(details.name)} · ${state.chapter + 1}/${chapters.length}</span>
    <button type="button" class="btn" data-x="next">下一章</button>
    <button type="button" class="btn" data-x="font-">A-</button>
    <button type="button" class="btn" data-x="font+">A+</button>
    <button type="button" class="btn" data-x="width">版心</button>
    <button type="button" class="btn" data-x="theme">主题</button>
    <button type="button" class="btn" data-x="shelf">加架</button>
    <button type="button" class="btn" data-x="exit">退出</button>`;
  $('#rbar').onclick = event => {
    const button = event.target.closest('[data-x]');
    if (!button) return;
    const action = button.dataset.x;
    if (action === 'prev') return loadChapter(state.chapter - 1);
    if (action === 'next') return loadChapter(state.chapter + 1);
    if (action === 'font-') { state.reader.font = Math.max(13, state.reader.font - 1); return savePrefs() }
    if (action === 'font+') { state.reader.font = Math.min(34, state.reader.font + 1); return savePrefs() }
    if (action === 'width') { state.reader.width = state.reader.width >= 900 ? 560 : state.reader.width + 120; return savePrefs() }
    if (action === 'theme') { cycleTheme(); return savePrefs() }
    if (action === 'exit') { saveProgress(); $('#reader').classList.remove('on'); go(store.read('lite.page', 'shelf')); return render() }
    if (action === 'toc') return drawToc();
    if (action === 'shelf') {
      post('/api/bookshelf', {
        sourceId: state.book.details.sourceId, bookUrl: state.book.bookUrl, name: state.book.details.name,
        author: state.book.details.author, tocUrl: state.book.details.tocUrl, coverUrl: state.book.details.coverUrl,
      }).then(() => toast('已加入书架')).catch(error => toast(error.message, 'err'));
    }
  };
  function savePrefs() { store.write('lite.reader', state.reader); applyPrefs() }
}
function applyPrefs() {
  const text = $('#rtxt');
  text.style.setProperty('--rf', state.reader.font + 'px');
  text.style.setProperty('--rw', state.reader.width + 'px');
  text.style.setProperty('--rl', state.reader.line);
}
function drawToc() {
  const panel = $('#toc');
  panel.innerHTML = '<div class="dh" style="padding:12px 14px;border-bottom:1px solid var(--line)">目录</div>' +
    state.book.chapters.map((c, i) => c.isVolume
      ? `<div class="item" style="cursor:default"><div class="t"><b>${esc(c.title)}</b></div></div>`
      : `<div class="item" data-ch="${i}"><div class="t"><b>${esc(c.title)}</b></div>${i === state.chapter ? '<span class="pill">当前</span>' : ''}</div>`).join('');
  panel.classList.add('on');
  panel.onclick = event => {
    const cell = event.target.closest('[data-ch]');
    if (cell) loadChapter(Number(cell.dataset.ch));
    panel.classList.remove('on');
  };
}
let loading = false;
async function loadChapter(index) {
  const chapters = state.book.chapters.filter(c => !c.isVolume);
  const position = index < 0 ? -1 : Math.min(index, chapters.length - 1);
  if (position < 0) return toast('已经是第一章', 'err');
  if (position > chapters.length - 1) return toast('已经是最后一章', 'err');
  if (loading) return;
  loading = true;
  state.chapter = position;
  store.write('lite.chapter', position);
  applyPrefs();
  drawReaderBar();
  $('#rtxt').innerHTML = '<p class="muted">载入中…</p>';
  $('#rbody').scrollTop = 0;
  const chapter = chapters[position];
  try {
    const data = await post('/api/books/content', {
      sourceId: state.book.details.sourceId, chapterUrl: chapter.url, bookUrl: state.book.bookUrl,
    });
    $('#rtxt').innerHTML = renderContent(data.title || chapter.title, data.content);
    saveProgress();
  } catch (error) {
    $('#rtxt').innerHTML = `<p class="muted">这一章取不到：${esc(error.message)}</p>`;
  }
  loading = false;
}
/** 正文按不可信输入处理：先整体转义，再只放行我们认识的两种结构。 */
function renderContent(title, body) {
  const lines = String(body || '').split(/\n+/);
  const out = ['<h3>' + esc(title) + '</h3>'];
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const image = /^!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)$/.exec(line);
    if (image) { out.push('<img src="' + esc(image[1]) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'); continue }
    out.push('<p>' + esc(line) + '</p>');
  }
  return out.join('');
}
function saveProgress() {
  if (!state.book) return;
  const chapters = state.book.chapters.filter(c => !c.isVolume);
  const chapter = chapters[state.chapter];
  if (!chapter) return;
  const box = $('#rbody');
  const max = box.scrollHeight - box.clientHeight;
  const ratio = max > 0 ? Math.min(1, Math.max(0, box.scrollTop / max)) : 0;
  put('/api/reading-progress', {
    sourceId: state.book.details.sourceId, bookUrl: state.book.bookUrl,
    chapterUrl: chapter.url, chapterIndex: state.chapter, scrollPosition: ratio,
  }).catch(() => undefined);
}
$('#rbody') && $('#rbody').addEventListener('scroll', () => {
  clearTimeout(saveProgress.timer);
  saveProgress.timer = setTimeout(saveProgress, 900);
});
document.addEventListener('keydown', event => {
  if (!$('#reader').classList.contains('on')) return;
  if (event.key === 'Escape') { $('#toc').classList.remove('on'); return }
  if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); loadChapter(state.chapter + 1) }
  if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); loadChapter(state.chapter - 1) }
});

/* ---------- 启动 ---------- */
(async function boot() {
  applyTheme();
  applyPrefs();
  try {
    const session = await get('/api/auth/session');
    csrf = session.csrfToken || '';
    if (session.authenticated === false) toast('服务端要求登录', 'err');
  } catch (error) { toast('连不上服务端：' + error.message, 'err') }
  try { state.sources = await get('/api/sources') } catch {}
  render();
})();
</script>
</body>
